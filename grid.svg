<svg width="1200" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050202"/>
      <stop offset="100%" stop-color="#0d0303"/>
    </linearGradient>

    <pattern id="gridLines" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#ff2b2b" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>

    <radialGradient id="gFade" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#ff2b00" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#ff2b00" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff8c00" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff0033" stop-opacity="0"/>
    </linearGradient>

    <filter id="gGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="200" fill="url(#gBg)"/>
  <rect width="1200" height="200" fill="url(#gridLines)"/>
  <rect width="1200" height="200" fill="url(#gFade)"/>

  <rect x="0" y="0" width="1200" height="2" fill="url(#gLine)" filter="url(#gGlow)">
    <animate attributeName="y" values="0;198;0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g stroke="#ff5c1a" stroke-opacity="0.5" stroke-width="1">
    <line x1="0" y1="0" x2="200" y2="200"><animate attributeName="stroke-opacity" values="0.1;0.5;0.1" dur="4s" repeatCount="indefinite"/></line>
    <line x1="1200" y1="0" x2="1000" y2="200"><animate attributeName="stroke-opacity" values="0.1;0.5;0.1" dur="5s" repeatCount="indefinite"/></line>
    <line x1="600" y1="0" x2="600" y2="200"><animate attributeName="stroke-opacity" values="0.05;0.3;0.05" dur="6s" repeatCount="indefinite"/></line>
  </g>

  <g fill="#ff8c00">
    <circle cx="150" cy="100" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="50" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="150" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="70" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>
