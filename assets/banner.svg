<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050303"/>
      <stop offset="45%" stop-color="#120404"/>
      <stop offset="100%" stop-color="#050303"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3d1a">
        <animate attributeName="stop-color" values="#ff3d1a;#ff8c00;#ff0033;#ff3d1a" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ff8c00">
        <animate attributeName="stop-color" values="#ff8c00;#ff0033;#ff3d1a;#ff8c00" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff0033">
        <animate attributeName="stop-color" values="#ff0033;#ff3d1a;#ff8c00;#ff0033" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff8c00" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff0033" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2200" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff2200" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ff2b2b" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>

    <clipPath id="frame">
      <rect width="1200" height="360" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bgGrad)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>

    <circle cx="150" cy="80" r="220" fill="url(#glowSpot)">
      <animate attributeName="cx" values="150;250;150" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="300" r="240" fill="url(#glowSpot)">
      <animate attributeName="cx" values="1050;950;1050" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- scanning line -->
    <rect x="0" y="0" width="1200" height="2" fill="url(#lineGrad)" opacity="0.7">
      <animate attributeName="y" values="0;360;0" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- floating particles -->
    <g fill="#ff5c1a">
      <circle cx="80" cy="60" r="2"><animate attributeName="cy" values="60;300;60" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="220" cy="200" r="1.6"><animate attributeName="cy" values="200;20;200" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="400" cy="320" r="2.2"><animate attributeName="cy" values="320;60;320" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="11s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="40" r="1.8"><animate attributeName="cy" values="40;280;40" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="260" r="2"><animate attributeName="cy" values="260;30;260" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="120" r="1.5"><animate attributeName="cy" values="120;340;120" dur="9.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9.5s" repeatCount="indefinite"/></circle>
      <circle cx="1000" cy="60" r="2"><animate attributeName="cy" values="60;320;60" dur="12.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="12.5s" repeatCount="indefinite"/></circle>
      <circle cx="500" cy="180" r="1.4"><animate attributeName="cy" values="180;10;180" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- static twinkling stars -->
    <g fill="#ffb37a">
      <circle cx="60" cy="150" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="60" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="250" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="90" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="320" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- border frame -->
    <rect x="4" y="4" width="1192" height="352" rx="16" fill="none" stroke="#ff2b2b" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="10" y="10" width="1180" height="340" rx="14" fill="none" stroke="#ff8c00" stroke-opacity="0.15" stroke-width="1"/>

    <!-- MEDU title -->
    <text x="600" y="160" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="url(#titleGrad)" filter="url(#bigGlow)" letter-spacing="14">MEDU</text>

    <!-- subtitle -->
    <text x="600" y="205" text-anchor="middle" font-family="'Consolas', monospace" font-size="20" fill="#ff9a5c" letter-spacing="4" filter="url(#softGlow)">DISCORD BOT DEVELOPER // CYBER SECURITY</text>

    <!-- tag row -->
    <text x="600" y="245" text-anchor="middle" font-family="'Consolas', monospace" font-size="15" fill="#ff5c3d" letter-spacing="6" opacity="0.85">PYTHON · BATCH · JAVASCRIPT</text>

    <!-- glowing divider -->
    <rect x="360" y="272" width="480" height="2" fill="url(#lineGrad)" filter="url(#softGlow)">
      <animate attributeName="width" values="0;480;480" dur="2.5s" fill="freeze"/>
      <animate attributeName="x" values="600;360;360" dur="2.5s" fill="freeze"/>
    </rect>

    <text x="600" y="305" text-anchor="middle" font-family="'Consolas', monospace" font-size="14" fill="#ff7a3d" letter-spacing="3" opacity="0.75">github.com/meduuv</text>
  </g>
</svg>
