<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050303"/>
      <stop offset="100%" stop-color="#0d0202"/>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a0000" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7a0f00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3a0000" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2b00" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#ff8c00" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff2b00" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="fLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff8c00" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff0033" stop-opacity="0"/>
    </linearGradient>

    <filter id="fGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="220" fill="url(#fBg)"/>

  <path d="M0,150 C300,100 900,200 1200,140 L1200,220 L0,220 Z" fill="url(#waveGrad1)">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="
      M0,150 C300,100 900,200 1200,140 L1200,220 L0,220 Z;
      M0,140 C300,190 900,100 1200,160 L1200,220 L0,220 Z;
      M0,150 C300,100 900,200 1200,140 L1200,220 L0,220 Z"/>
  </path>

  <path d="M0,170 C350,130 850,210 1200,160 L1200,220 L0,220 Z" fill="url(#waveGrad2)">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
      M0,170 C350,130 850,210 1200,160 L1200,220 L0,220 Z;
      M0,160 C350,205 850,130 1200,175 L1200,220 L0,220 Z;
      M0,170 C350,130 850,210 1200,160 L1200,220 L0,220 Z"/>
  </path>

  <rect x="0" y="40" width="1200" height="1.5" fill="url(#fLine)" filter="url(#fGlow)"/>

  <g fill="#ff5c1a">
    <circle cx="100" cy="60" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="30" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="55" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="35" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="105" text-anchor="middle" font-family="'Consolas', monospace" font-size="18" fill="#ff8c00" letter-spacing="4" filter="url(#fGlow)">THANKS FOR VISITING</text>
  <text x="600" y="130" text-anchor="middle" font-family="'Consolas', monospace" font-size="12" fill="#ff5c3d" letter-spacing="2" opacity="0.7">github.com/meduuv // guns.lol/meduu</text>
</svg>
