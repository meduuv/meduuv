<svg width="1200" height="40" viewBox="0 0 1200 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0"/>
      <stop offset="15%" stop-color="#ff2b00" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff8c00" stop-opacity="1"/>
      <stop offset="85%" stop-color="#ff2b00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff0033" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="dSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffd9a0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="dGlow" x="-60%" y="-300%" width="220%" height="700%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="18" width="1200" height="2" fill="url(#dGrad)" filter="url(#dGlow)"/>

  <rect x="-300" y="17" width="300" height="4" fill="url(#dSweep)" filter="url(#dGlow)">
    <animate attributeName="x" values="-300;1200" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <circle cx="600" cy="19" r="3" fill="#ff8c00" filter="url(#dGlow)">
    <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
