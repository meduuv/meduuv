<svg width="1200" height="120" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d0303"/>
      <stop offset="100%" stop-color="#050202"/>
    </radialGradient>
    <filter id="starGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="120" fill="url(#sBg)"/>

  <g fill="#ffb37a" filter="url(#starGlow)">
