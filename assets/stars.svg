      <animate attributeName="opacity" values="0;1;0" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="102" r="1.7" filter="url(#starGlow)">
      <animate attributeName="cy" values="102;12;102" dur="13s" repeatCount="indefinite"/>
