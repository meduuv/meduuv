<svg width="1400" height="360" viewBox="0 0 1400 360" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050505"/><stop offset="0.5" stop-color="#140500"/><stop offset="1" stop-color="#050505"/>
  </linearGradient>
  <linearGradient id="fire" x1="0" x2="1"><stop stop-color="#ff1f00"/><stop offset="0.5" stop-color="#ff9a00"/><stop offset="1" stop-color="#ff2600"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#ff4b00" stop-opacity=".28"/><stop offset="1" stop-color="#ff4b00" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#ff5a00" stroke-opacity=".09"/></pattern>
</defs>
<rect width="1400" height="360" fill="url(#bg)"/>
<rect width="1400" height="360" fill="url(#grid)"/>
<ellipse cx="700" cy="180" rx="520" ry="190" fill="url(#glow)" filter="url(#blur)">
  <animate attributeName="rx" values="430;560;430" dur="5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".55;.9;.55" dur="5s" repeatCount="indefinite"/>
</ellipse>
<g opacity=".75" fill="#ff8c00">
  <circle cx="120" cy="90" r="2"><animate attributeName="cy" values="90;270;90" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="1270" cy="270" r="2"><animate attributeName="cy" values="270;70;270" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="350" cy="300" r="1.5"><animate attributeName="cx" values="350;1050;350" dur="11s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="80" r="1.5"><animate attributeName="cx" values="1080;420;1080" dur="8s" repeatCount="indefinite"/></circle>
</g>
<g fill="none" stroke="url(#fire)" opacity=".55">
  <path d="M0 300 C250 220 350 340 560 250 S980 130 1400 220" stroke-width="1.5">
    <animate attributeName="d" dur="8s" repeatCount="indefinite" values="M0 300 C250 220 350 340 560 250 S980 130 1400 220;M0 250 C220 330 390 180 610 290 S1030 330 1400 170;M0 300 C250 220 350 340 560 250 S980 130 1400 220"/>
  </path>
</g>
<rect x="0" y="0" width="1400" height="4" fill="url(#fire)">
  <animate attributeName="y" values="0;356;0" dur="6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".15;.8;.15" dur="6s" repeatCount="indefinite"/>
</rect>
<text x="700" y="155" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="78" font-weight="800" letter-spacing="18">MEDUUV</text>
<text x="700" y="205" text-anchor="middle" fill="#ff8c00" font-family="monospace" font-size="20" letter-spacing="6">AI • AUTOMATION • SECURITY • TOOLING</text>
<text x="700" y="250" text-anchor="middle" fill="#b7b7b7" font-family="monospace" font-size="14" letter-spacing="3">BUILDING SYSTEMS, NOT JUST PROJECTS</text>
<g>
  <rect x="515" y="280" width="370" height="2" rx="1" fill="url(#fire)"/>
  <circle cx="515" cy="281" r="4" fill="#ff8c00"><animate attributeName="cx" values="515;885;515" dur="3s" repeatCount="indefinite"/></circle>
</g>
</svg>